isplay:block;color:var(--muted);font-weight:800;margin-top:7px;font-size:11px}.section-heading{font-weight:1000;font-size:18px;letter-spacing:-.4px;margin:24px 0 12px}.breakdown-row{margin:12px 0}.breakdown-labels{display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:850;margin:0 0 8px}.bar-bg{height:11px;border-radius:99px;background:var(--track);overflow:hidden}.bar-fill{height:100%;border-radius:99px;background:var(--progress)}.advice{padding:16px 18px;border-radius:16px;background:var(--story-bg);border:1px solid var(--accent-border);line-height:1.6;font-size:14px;margin-top:18px}.advice strong{color:var(--accent)}.review{margin-top:20px;border-top:1px solid var(--line);padding-top:18px}.review summary{list-style:none;font-weight:950;display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:5px 0 14px;gap:12px}.review summary::-webkit-details-marker{display:none}.review summary::after{content:"⌄";font-size:24px;color:var(--accent)}.review[open] summary::after{content:"⌃"}.review-item{padding:14px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.55}.review-item b{display:block;margin-bottom:3px}.review-item .rmeta{font-size:11px;letter-spacing:.04em;text-transform:uppercase;font-weight:950;color:var(--accent);margin-bottom:6px}.review-item p{margin:4px 0;color:var(--muted)}.review-item .answer-correct{color:var(--text);font-weight:850}.result-actions{display:flex;gap:10px;margin-top:21px;flex-wrap:wrap}.result-actions>*{flex:1;min-width:175px}.parent-note{border-top:1px solid var(--line);margin-top:26px;padding-top:16px;font-size:12px;color:var(--muted);line-height:1.6}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);z-index:20;border-radius:14px;padding:12px 17px;background:var(--toast-bg);color:var(--toast-text);box-shadow:0 12px 35px #0003;font-size:13px;font-weight:850;max-width:calc(100% - 30px);text-align:center;animation:rise .2s}.restart-note{font-size:11px;color:var(--muted);margin:10px 0 0}.corner-deco{position:absolute;pointer-events:none;font-size:22px;opacity:.75;animation:bob 4s infinite;z-index:0}.corner-deco.one{top:8px;right:20px}.corner-deco.two{bottom:12px;left:30%;animation-delay:-1.4s}.no-select{-webkit-user-select:none;user-select:none}@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-11px) rotate(3deg)}}@keyframes stars{from{transform:translateY(0);opacity:.5}to{transform:translateY(-9px);opacity:1}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes pop{from{opacity:0;transform:scale(.4) rotate(-35deg)}to{opacity:1;transform:scale(1) rotate(-5deg)}}@media(max-width:620px){.shell{width:min(100% - 26px,550px);padding-top:14px}.topbar{margin-bottom:17px}.hero{padding:24px 22px}.hero-grid{grid-template-columns:1fr}.hero h1{font-size:42px;line-height:1.08;letter-spacing:-1.8px;margin-top:15px}.hero-art{height:205px;max-height:205px;width:100%;margin:6px auto -8px;order:-1}.hero-text{order:2}.mini-info{grid-template-columns:repeat(3,1fr);gap:7px}.info-item{padding:13px 6px}.info-item strong{font-size:11px}.info-item small{font-size:10px}.fun-row{margin-top:18px;gap:7px}.fun-chip{font-size:11px;padding:8px 9px}.answers{grid-template-columns:1fr;gap:9px}.answer{min-height:62px;font-size:15px}.question-card{padding:23px 18px}.question-card h2{font-size:24px}.question-actions .cta{flex:1}.results{padding:23px 19px}.story{padding:14px 16px}.score-stat{padding:14px 5px}.score-stat small{font-size:10px}}@media(max-width:375px){.top-right .pill{font-size:9px;padding:8px}.logo{font-size:18px}.hero h1{font-size:36px}.question-actions{display:grid;grid-template-columns:1fr 1fr}.question-actions .cta{min-width:0}.answer{font-size:14px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

:root{--base:#fff5fc;--sky:radial-gradient(ellipse 75% 53% at 76% 12%,#ffd5eb 0%,transparent 85%),radial-gradient(ellipse 65% 60% at 0% 72%,#ded3ff 0%,transparent 80%),linear-gradient(155deg,#fff4fb,#f0ebff 86%);--twinkle:#ff9fdb;--text:#49306d;--muted:#7e658e;--panel:rgba(255,255,255,.94);--subpanel:#fbf2ff;--line:#eed9f2;--accent:#ae4cb9;--accent-bg:#fae8fc;--accent-border:#edbfef;--logo-bg:linear-gradient(135deg,#ffa7d8,#bd98ff);--shadow:rgba(167,90,154,.15);--tag-bg:#fff5fc;--chip:#fdf0ff;--button-gradient:linear-gradient(135deg,#fa78b7,#b68cff);--button-text:#fff;--button-shadow:rgba(205,96,190,.28);--art-shadow:rgba(242,120,189,.19);--track:#f2e4f5;--progress:linear-gradient(90deg,#ff81b9,#bd9cff);--story-bg:#fff5fa;--answer-border:#efd9f1;--answer-bg:#fffbff;--selected:#f9e6ff;--answer-ring:rgba(174,76,185,.10);--letter-bg:#f5eafa;--focus:#b767d1;--toast-bg:#a44cb3;--toast-text:#fff}

<script>window.DIVERTOONS_CONFIG={"theme":"girl","title":"Magical Reading & Math","subjects":{"reading":{"label":"Reading","icon":"📖"},"logic":{"label":"Logic","icon":"🧩"},"math":{"label":"Math","icon":"🧮"}},"sequence":["reading","logic","math","reading","logic","math","reading","logic","math","reading","logic","math"],"bank":{"reading":{"1":[{"id":"gr101","prompt":"What did Clara most likely see out the window?","options":["A sunny sky","A dark night","Falling snow","Heavy rain"],"correct":0,"why":"She put the umbrella back and chose sunglasses, so it was sunny.","passage":"Clara grabbed her umbrella, then looked out the window, put it back, and reached for her sunglasses instead. She smiled and skipped outside."},{"id":"gr102","prompt":"What does Pepper probably think is about to happen?","options":["He is in trouble","A cat is in the garden","It is bath time","Someone is coming home or going out"],"correct":3,"why":"Pepper runs to the door when keys jingle, because keys mean someone is arriving or leaving.","passage":"Ana's dog, Pepper, wags his tail and runs to the door every time he hears keys jingle. Today he heard the jingle and barked happily."},{"id":"gr103","prompt":"What most likely happened during the week?","options":["Mila lost her money","The book became free","Mila earned at least $3","Mila forgot about the book"],"correct":2,"why":"She needed $3 more, helped all week, then proudly went to buy the book.","passage":"Mila wanted a book that cost $8. She had only $5 in her piggy bank. All week she helped her grandmother water the plants, and on Saturday she proudly walked to the bookstore."},{"id":"gr104","prompt":"What does “timid” mean in this story?","options":["Playful","Shy and easily scared","Sleepy","Very hungry"],"correct":1,"why":"The kitten hides whenever visitors come, which is what a shy, scared animal does.","passage":"The kitten was so timid that it hid under the bed whenever a visitor rang the doorbell."},{"id":"gr105","prompt":"What did Rosa do while the cake was baking?","options":["Washed the bowls","Added pink frosting","Poured the batter","Mixed the flour and eggs"],"correct":0,"why":"The story says she washed the bowls “while the cake baked.”","passage":"First, Rosa mixed the flour and eggs. Next, she poured the batter into a pan. While the cake baked, she washed the bowls. Finally, she added pink frosting."}],"2":[{"id":"gr201","prompt":"What is the main lesson of the story?","options":["Teachers like spiders","Spiders are dangerous","Knights should not read","Being brave doesn't mean never being afraid"],"correct":3,"why":"Even the bravest knight-in-training felt afraid, and her teacher explains that this is normal.","passage":"Everyone in the castle said Princess Elena was the bravest knight-in-training. Yet when a tiny spider dropped onto her book, she shrieked and leapt onto her chair. Her teacher chuckled, “Even the bravest have something they fear.”"},{"id":"gr202","prompt":"Why did the farmers look at every cloud with hope?","options":["They liked cloud shapes","They needed rain for their fields","They were afraid of storms","They wanted to go swimming"],"correct":1,"why":"No rain for weeks, a low river and brown fields mean the farmers were hoping for rain.","passage":"The village had not seen rain for weeks. The river was low, the fields were brown, and the farmers looked up at every cloud with hope."},{"id":"gr203","prompt":"Why did Sam pretend to be reading?","options":["He loves reading","He was looking for a book","He didn't want Mom to know he peeked","He was bored"],"correct":2,"why":"He re-wrapped the gift exactly as he found it and acted casual, so he was hiding what he did.","passage":"Sam peeked at the birthday gift, then quickly re-wrapped the paper and placed it back exactly where he found it. When Mom walked in, he was on the couch with a book, whistling."},{"id":"gr204","prompt":"Which marker does Lily have now that she did not have before?","options":["Blue","Red","None","Gold"],"correct":0,"why":"Max only agreed to trade his blue marker for the gold one, and Lily handed it over, so Lily got the blue marker.","passage":"Lily said, “I'll trade you my red marker for your blue one.” Max shook his head. “Blue is my favorite, but I'd trade it for your gold marker.” Lily thought for a moment and handed him the gold one."},{"id":"gr205","prompt":"What does “exhausted” mean here?","options":["Excited","Very tired","Lost","Angry"],"correct":1,"why":"After hours of hiking uphill they could barely lift their feet, so they were very tired.","passage":"After hours of hiking up the mountain, the exhausted travelers could barely lift their feet."}],"3":[{"id":"gr301","prompt":"What does “a tiny green finger” describe?","options":["A caterpillar","Her own finger","A green crayon","A small sprout"],"correct":3,"why":"The journal follows a seed growing; the “green finger” is the first sprout poking out.","passage":"Odette kept a garden journal. Monday: “The seed is still sleeping.” Wednesday: “A tiny green finger is poking out of the soil.” Saturday: “It has two leaves now, reaching for the window.”"},{"id":"gr302","prompt":"Why did the fox praise the crow?","options":["He was lost","He loved her singing","He wanted her to drop the cheese","He wanted to be her friend"],"correct":2,"why":"The fox used flattery so she would open her beak and drop the cheese.","passage":"The fox looked up at the crow and said, “Your voice must be as lovely as your feathers. Won't you sing for me?” The proud crow opened her beak to sing, and the cheese she was holding fell straight into the fox's mouth."},{"id":"gr303","prompt":"What do the clues suggest?","options":["Nadia cleaned her boots","Nadia was sick","Nadia had been outside","Nadia was telling the truth"],"correct":2,"why":"Muddy boots, cold cheeks and a fresh pinecone are all clues that she had been outdoors.","passage":"Nadia said she had been home all afternoon. But her boots were muddy, her cheeks were red from the cold, and there was a fresh pinecone in her coat pocket."},{"id":"gr304","prompt":"What does “meager” mean?","options":["Very small; not enough","Delicious","Hot","Fancy"],"correct":0,"why":"One small potato and a sip of soup is a tiny meal.","passage":"The travelers' dinner was meager: one small potato and a sip of soup for each of them."},{"id":"gr305","prompt":"About how many hours did Ivy sleep?","options":["2","10","16","7"],"correct":1,"why":"She fell asleep at 9 o'clock at night and woke at 7 in the morning: that is 10 hours.","passage":"Grandpa's clock chimes once for every hour. Ivy fell asleep at night right after it chimed nine times, and woke up the next morning just as it chimed seven times."},{"id":"gr306","prompt":"What is the main idea of this text?","options":["Bees can sting","Flowers smell nice","Apples are red","Bees are important for growing many foods"],"correct":3,"why":"Every sentence explains how bees help plants make fruit and seeds.","passage":"Bees carry pollen from flower to flower. This helps plants make fruit and seeds. Without bees, many foods — like apples, almonds and berries — would be very hard to grow."}]},"logic":{"1":[{"id":"gl101","prompt":"Rosa is taller than Mia. Mia is taller than Zoe. Who is the shortest?","options":["Rosa","Mia","Cannot tell","Zoe"],"correct":3,"why":"Rosa > Mia > Zoe, so Zoe is shortest."},{"id":"gl102","prompt":"All unicorns in the meadow have silver horns. Stella is a unicorn in the meadow. What must be true?","options":["Stella can fly","Stella is pink","Stella has a silver horn","Stella is the oldest"],"correct":2,"why":"The rule is about all unicorns in the meadow, so it includes Stella."},{"id":"gl103","prompt":"Which one does NOT belong? Rose, Tulip, Daisy, Carrot","options":["Carrot","Tulip","Rose","Daisy"],"correct":0,"why":"Rose, tulip and daisy are flowers; a carrot is a vegetable."},{"id":"gl104","prompt":"If today is Monday, what day was it 3 days ago?","options":["Saturday","Friday","Sunday","Thursday"],"correct":1,"why":"Sunday, Saturday, Friday: three days back is Friday."},{"id":"gl105","prompt":"A box has only red and blue beads. You take out 3 beads without looking. Must at least two of them be the same color?","options":["No, never","Only sometimes","Only if they are red","Yes, always"],"correct":3,"why":"With only two colors, the third bead has to match one of the first two."}],"2":[{"id":"gl201","prompt":"Ana, Bea and Cleo each have one pet: a cat, a dog or a fish. Ana does not have the cat. Bea has the fish. What does Ana have?","options":["The dog","Cannot tell","The fish","The cat"],"correct":0,"why":"Bea has the fish and Ana can't have the cat, so Ana has the dog."},{"id":"gl202","prompt":"In a line, Lucy is 4th from the front and 4th from the back. How many children are in the line?","options":["9","8","7","6"],"correct":2,"why":"3 children ahead of her, Lucy, and 3 behind her: 3 + 1 + 3 = 7."},{"id":"gl203","prompt":"If it is raining, Tia always takes her umbrella. Today Tia did NOT take her umbrella. What can you be sure of?","options":["It is raining","It is not raining","Tia lost her umbrella","Nothing at all"],"correct":1,"why":"If it were raining she would have taken it, so it must not be raining."},{"id":"gl204","prompt":"Five girls sit in a row. Isla sits in the middle seat. Nora sits right next to Isla, on her left. Counting from the left, which seat is Nora in?","options":["Seat 1","Seat 3","Seat 4","Seat 2"],"correct":3,"why":"The middle of 5 seats is seat 3, so the seat on its left is seat 2."},{"id":"gl205","prompt":"Pip has more stickers than Kiki but fewer than Lulu. Mo has more than Lulu. Who has the second most?","options":["Lulu","Pip","Mo","Kiki"],"correct":0,"why":"The order is Mo, Lulu, Pip, Kiki."}],"3":[{"id":"gl301","prompt":"A dragon tells the truth only on Mondays and lies on every other day. Today it says, “Today is Monday.” What day could it be?","options":["Only Monday","Any day of the week","No day at all","Any day except Monday"],"correct":1,"why":"On Monday the sentence is true (it tells the truth). On any other day the sentence is false, and the dragon lies, so it could say it too."},{"id":"gl302","prompt":"A frog is at the bottom of 10 steps. Each minute it hops up 3 steps, then slides down 1. In which minute does it first reach step 10?","options":["Minute 6","Minute 10","Minute 5","Minute 4"],"correct":2,"why":"After 4 minutes it is on step 8. In minute 5 it hops up 3 and reaches the top before sliding."},{"id":"gl303","prompt":"Ava, Bella, Cara and Dana each wear a different color: red, blue, green or gold. Ava wears red. Bella doesn't wear blue or gold. Cara doesn't wear blue. What does Dana wear?","options":["Red","Green","Blue","Gold"],"correct":2,"why":"Ava is red, so Bella must be green. Cara can't be blue, so she is gold. Dana gets blue."},{"id":"gl304","prompt":"Some cats are fluffy. All fluffy animals love being brushed. Which MUST be true?","options":["All fluffy animals are cats","No cats love being brushed","All cats love being brushed","Some cats love being brushed"],"correct":3,"why":"The fluffy cats are fluffy animals, so at least those cats love brushing."},{"id":"gl305","prompt":"Four friends meet, and each one hugs every other friend exactly once. How many hugs happen?","options":["4","6","12","8"],"correct":1,"why":"Count pairs: AB, AC, AD, BC, BD, CD = 6 hugs."},{"id":"gl306","prompt":"A chest holds 10 gems: only rubies and pearls. There are 4 more rubies than pearls. How many pearls are there?","options":["3","7","4","6"],"correct":0,"why":"3 pearls and 7 rubies: 7 − 3 = 4 and 7 + 3 = 10."}]},"math":{"1":[{"id":"gm101","prompt":"What is 46 + 37?","options":["83","73","93","84"],"correct":0,"why":"46 + 40 = 86, then subtract 3: 83."},{"id":"gm102","prompt":"What is 72 − 38?","options":["36","46","34","44"],"correct":2,"why":"72 − 40 = 32, then add 2 back: 34."},{"id":"gm103","prompt":"What is 7 × 8?","options":["63","58","54","56"],"correct":3,"why":"7 × 8 = 56."},{"id":"gm104","prompt":"A pack has 6 hair clips. How many clips are in 7 packs?","options":["48","42","40","36"],"correct":1,"why":"7 × 6 = 42."},{"id":"gm105","prompt":"What is 100 − 45?","options":["65","55","45","60"],"correct":1,"why":"45 + 55 = 100."}],"2":[{"id":"gm201","prompt":"Luna has 3 bags with 12 gems in each. She gives 9 gems to her sister. How many gems does Luna have left?","options":["27","25","33","45"],"correct":0,"why":"3 × 12 = 36; 36 − 9 = 27."},{"id":"gm202","prompt":"A movie starts at 4:45 PM and lasts 1 hour 30 minutes. When does it end?","options":["6:45 PM","5:15 PM","6:15 PM","5:45 PM"],"correct":2,"why":"4:45 + 1 hour = 5:45; + 30 minutes = 6:15 PM."},{"id":"gm203","prompt":"What is one third of 27?","options":["12","7","6","9"],"correct":3,"why":"27 ÷ 3 = 9."},{"id":"gm204","prompt":"Bea buys 4 ribbons at $3 each and a crown for $7. She pays with $20. How much change does she get?","options":["$5","$1","$3","$9"],"correct":1,"why":"4 × $3 = $12; $12 + $7 = $19; $20 − $19 = $1."},{"id":"gm205","prompt":"Which fraction is the largest?","options":["1/2","3/5","2/3","3/4"],"correct":3,"why":"3/4 is 75%, bigger than 2/3 (about 67%), 3/5 (60%) and 1/2 (50%)."},{"id":"gm206","prompt":"A garden has 5 rows with 8 roses in each. 13 roses are pink and the rest are white. How many are white?","options":["27","23","35","33"],"correct":0,"why":"5 × 8 = 40 roses; 40 − 13 = 27."}],"3":[{"id":"gm301","prompt":"I think of a number, double it, then add 7. The answer is 31. What was my number?","options":["19","14","12","10"],"correct":2,"why":"Work backwards: 31 − 7 = 24, and 24 ÷ 2 = 12."},{"id":"gm302","prompt":"A garden is 9 m long and 6 m wide. What is the distance all the way around it (the perimeter)?","options":["36 m","30 m","15 m","54 m"],"correct":1,"why":"9 + 6 + 9 + 6 = 30 m."},{"id":"gm303","prompt":"3 unicorns eat 12 apples in one day. How many apples do 5 unicorns eat in 2 days?","options":["30","20","24","40"],"correct":3,"why":"Each unicorn eats 4 a day. 5 × 4 = 20 a day, × 2 days = 40."},{"id":"gm304","prompt":"What is 25% of 80?","options":["20","16","25","40"],"correct":0,"why":"25% is one quarter; 80 ÷ 4 = 20."},{"id":"gm305","prompt":"Mia is 8 and her mom is 4 times as old. How old will her mom be when Mia is 14?","options":["56","40","38","44"],"correct":2,"why":"Mom is 32 now. In 6 years (when Mia is 14) she will be 38."},{"id":"gm306","prompt":"A ribbon 2 meters long is cut into pieces that are each 25 cm long. How many pieces are there?","options":["4","6","10","8"],"correct":3,"why":"2 m = 200 cm; 200 ÷ 25 = 8."}]}},"art":"<svg class=\"hero-art\" viewBox=\"0 0 380 320\" role=\"img\" aria-label=\"Friendly white unicorn with a rainbow, fairy-tale castle, and sparkling stars\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"rainbowPink\" x1=\"0\" x2=\"1\"><stop stop-color=\"#ffa1c9\"/><stop offset=\"1\" stop-color=\"#c198ff\"/></linearGradient><linearGradient id=\"magicMane\" x1=\"0\" x2=\"1\" y1=\"0\" y2=\"1\"><stop stop-color=\"#a7a6fa\"/><stop offset=\".48\" stop-color=\"#f898d3\"/><stop offset=\"1\" stop-color=\"#ffe7a5\"/></linearGradient><linearGradient id=\"unicornWhite\" x1=\"0\" x2=\".6\" y1=\"0\" y2=\"1\"><stop stop-color=\"#fff\"/><stop offset=\"1\" stop-color=\"#f6edff\"/></linearGradient></defs><path d=\"M20 234 A156 156 0 0 1 332 234\" fill=\"none\" stroke=\"#ffdca3\" stroke-width=\"17\" opacity=\".7\"/><path d=\"M43 235 A134 134 0 0 1 311 235\" fill=\"none\" stroke=\"#ff9ecb\" stroke-width=\"16\" opacity=\".8\"/><path d=\"M65 236 A112 112 0 0 1 289 236\" fill=\"none\" stroke=\"#b4adfb\" stroke-width=\"17\" opacity=\".8\"/><path d=\"M88 237 A89 89 0 0 1 266 237\" fill=\"none\" stroke=\"#92dfcf\" stroke-width=\"13\" opacity=\".7\"/><g fill=\"#fff\"><ellipse cx=\"41\" cy=\"238\" rx=\"36\" ry=\"21\"/><ellipse cx=\"70\" cy=\"246\" rx=\"40\" ry=\"17\"/><ellipse cx=\"321\" cy=\"246\" rx=\"48\" ry=\"18\"/><ellipse cx=\"345\" cy=\"234\" rx=\"31\" ry=\"26\"/></g><g opacity=\".8\"><path d=\"M302 187 v-45 l19 -16 19 16 v45\" fill=\"#c0adf6\"/><path d=\"M293 145 v-26 l19 -15 19 15 v26\" fill=\"#e0c4fa\"/><path d=\"M308 109 V83 l-9 9 13 13 13 -13 -9 -9 v26\" fill=\"#f3b7db\"/><path d=\"M326 187 v-33 h28 v33\" fill=\"#e5bdeb\"/><path d=\"M330 156 v-19 l10 -12 10 12 v19\" fill=\"#bdb4ff\"/><path d=\"M285 187 v-30 h17 v30\" fill=\"#f5c6e5\"/></g><g transform=\"translate(61 7)\"><path d=\"M147 78 C203 54 238 88 230 131 C276 161 249 242 193 256 L94 256 C72 206 63 163 81 116Z\" fill=\"url(#magicMane)\" stroke=\"#e2b7ee\" stroke-width=\"3\"/><path d=\"M150 105 L170 21 L187 107\" fill=\"#ffe9a2\" stroke=\"#e5aa5b\" stroke-width=\"4\"/><path d=\"M158 70 L179 75 M155 87 L185 92\" stroke=\"#e5b86e\" stroke-width=\"3\"/><path d=\"M107 112 Q93 70 110 64 Q135 60 145 122\" fill=\"#fff\" stroke=\"#dfd6f5\" stroke-width=\"4\"/><path d=\"M114 104 Q108 78 115 77 Q124 78 131 111\" fill=\"#f6add1\"/><path d=\"M182 112 Q185 70 204 77 Q219 86 205 129\" fill=\"#fff\" stroke=\"#dfd6f5\" stroke-width=\"4\"/><path d=\"M188 110 Q194 87 200 91 Q207 99 199 113\" fill=\"#f6add1\"/><path d=\"M113 100 Q154 80 192 107 Q225 134 205 186 Q194 202 182 234 L112 234 C97 205 85 183 86 157 Q89 118 113 100Z\" fill=\"url(#unicornWhite)\" stroke=\"#e9d9f3\" stroke-width=\"4\"/><path d=\"M95 173 Q65 172 65 192 Q67 223 111 221 L147 218 Q156 186 136 176Z\" fill=\"#fff\" stroke=\"#e9d9f3\" stroke-width=\"4\"/><ellipse cx=\"93\" cy=\"198\" rx=\"20\" ry=\"12\" fill=\"#ffbdd9\" opacity=\".45\"/><path d=\"M117 151 Q133 162 148 148\" fill=\"none\" stroke=\"#655078\" stroke-width=\"5\" stroke-linecap=\"round\"/><path d=\"M142 147 l4 -9 M134 151 l0 -10\" stroke=\"#655078\" stroke-width=\"3\" stroke-linecap=\"round\"/><circle cx=\"85\" cy=\"193\" r=\"3\" fill=\"#9974a9\"/><path d=\"M183 97 Q160 111 159 127 Q180 123 193 138 Q216 139 218 168\" fill=\"none\" stroke=\"#ffb0dc\" stroke-width=\"16\" stroke-linecap=\"round\"/><path d=\"M192 117 Q208 121 223 146\" fill=\"none\" stroke=\"#aeb5ff\" stroke-width=\"13\" stroke-linecap=\"round\"/><path d=\"M175 217 Q195 229 216 217\" fill=\"none\" stroke=\"#f6aedb\" stroke-width=\"11\" stroke-linecap=\"round\"/></g><path d=\"M54 67 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7Z\" fill=\"#ffa4d2\"/><path d=\"M305 35 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5Z\" fill=\"#f3b855\"/><path d=\"M343 92 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4Z\" fill=\"#bb9afa\"/><circle cx=\"31\" cy=\"153\" r=\"4\" fill=\"#bea0ff\"/><circle cx=\"352\" cy=\"171\" r=\"4\" fill=\"#ffa5d0\"/></svg>"};</script>
<script>(() => {
  'use strict';
  const app = document.querySelector('#app');
  const CONFIG = window.DIVERTOONS_CONFIG;
  const IS_GIRL = CONFIG.theme === 'girl';
  const LETTERS = ['A', 'B', 'C', 'D'];
  let state = {};
  let toastTimer;

  const escapeHTML = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi,n));
  const sample = xs => xs[Math.floor(Math.random()*xs.length)];
  const allCount = CONFIG.sequence.length;
  const SUBJECTS = CONFIG.subjects;
  const safeStopSpeech = () => { try { window.speechSynthesis?.cancel(); } catch(_) {} };

  function reset() {
    safeStopSpeech();
    state = { phase:'intro', index:0, chosen:null, current:null, history:[],
      used: new Set(), levels:Object.fromEntries(Object.keys(SUBJECTS).map(k => [k,2])) };
    render();
  }

  function chooseQuestion() {
    const subject = CONFIG.sequence[state.index];
    const desired = state.levels[subject];
    let choices = CONFIG.bank[subject][desired].filter(q => !state.used.has(q.id));
    if (!choices.length) {
      const levels = [1,2,3].sort((a,b) => Math.abs(a-desired)-Math.abs(b-desired));
      choices = levels.flatMap(level => CONFIG.bank[subject][level].filter(q => !state.used.has(q.id)));
    }
    if (!choices.length) throw Error('The question bank needs more unique questions for ' + subject);
    const q = sample(choices);
    state.used.add(q.id);
    return {...q, subject, level:desired};
  }

  function start() {
    state.phase = 'quiz';
    state.current = chooseQuestion();
    render();
  }

  function submit() {
    if (state.phase !== 'quiz' || state.chosen === null) return;
    record(state.chosen);
  }
  function skip() {
    if (state.phase !== 'quiz') return;
    record(null);
  }
  function record(chosen) {
    safeStopSpeech();
    const q = state.current;
    const correct = chosen === q.correct;
    state.history.push({...q, chosen, isCorrect: correct});
    state.levels[q.subject] = clamp(state.levels[q.subject] + (correct ? 1 : -1),1,3);
    state.index++;
    state.chosen = null;
    if (state.index === allCount) {
      state.phase = 'results';
      state.current = null;
    } else {
      state.current = chooseQuestion();
    }
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function header() {
    return `<header class="topbar"><div class="logo" aria-label="Divertoons"><div class="brand-mark" aria-hidden="true">${IS_GIRL?'✦':'◈'}</div><span>DIVER<span>TOONS</span></span></div><div class="top-right"><span class="pill">${IS_GIRL?'🦄 MAGIC QUEST':'🚀 BRAIN LAB'}</span></div></header>`;
  }

  function intro() {
    const mini = IS_GIRL ? [
      ['📖','Reading','Discover stories'],['🧩','Logic','Crack riddles'],['➕','Math','Solve fun puzzles']
    ] : [
      ['🧠','Logic','Think it through'],['🔢','Math','Mental challenges'],['✨','Patterns','Spot the rule']
    ];
    return `${header()}<section class="hero"><span class="corner-deco one" aria-hidden="true">${IS_GIRL?'💖':'✦'}</span><div class="hero-grid"><div class="hero-text"><div class="eyebrow">${IS_GIRL?'✧ WELCOME TO THE MAGIC KINGDOM':'✦ YOUR ADVENTURE STARTS HERE'}</div><h1>${IS_GIRL?'Little steps.<br><em>Big magic.</em>':'Big ideas.<br><em>Bold brain.</em>'}</h1><p>${IS_GIRL?'A storybook adventure full of unicorns, tricky riddles, and magical math. Every question is a new chance to shine.':'Ready for a cosmic brain mission? Explore numbers, uncover hidden patterns, and solve mysteries with your own superpower: thinking.'}</p><div class="fun-row"><span class="fun-chip">🧩 ${allCount} challenges</span><span class="fun-chip">🪄 Adapts to you</span><span class="fun-chip">🕒 No timer</span></div><button type="button" class="cta big-cta" id="start">${IS_GIRL?'Enter the magic kingdom':'Launch my mission'} <span aria-hidden="true">➜</span></button></div>${CONFIG.art}</div></section><div class="mini-info">${mini.map(x=>`<div class="info-item"><span class="ico" aria-hidden="true">${x[0]}</span><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('')}</div><p class="footnote">${IS_GIRL?'Read the stories by yourself if you can. You may listen to logic and math questions.':'You can hear the questions out loud. Take your time and think for yourself.'}<br>Scores help you practice — they do not measure intelligence or IQ.</p>`;
  }

  function showQuestion() {
    const q = state.current;
    const progress = Math.round(state.index / allCount * 100);
    const canSpeak = ('speechSynthesis' in window) && (!IS_GIRL || q.subject !== 'reading');
    return `${header()}<div class="quiz-head"><div class="small-title">${IS_GIRL?'✨ Royal quest':'🛸 Mission log'} <span style="opacity:.65">${state.index+1} / ${allCount}</span></div><span class="pill">${Math.round((state.index+1)/allCount*100)}% ★</span></div><div class="progress-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progress}" aria-label="Challenge progress"><div class="progress-fill" style="width:${progress}%"></div></div><main class="question-card" aria-live="polite"><div class="question-top"><span class="subject">${SUBJECTS[q.subject].icon} ${SUBJECTS[q.subject].label}</span><span class="level">${IS_GIRL?'One step at a time':'Think before you tap'} ✦</span></div>${q.passage ? `<div class="story"><div class="story-label">📖 Read this story</div>${escapeHTML(q.passage)}</div>` : ''}<h2 id="question-title">${escapeHTML(q.prompt)}</h2>${canSpeak ? '<button type="button" class="quiet-btn listen" id="listen" aria-label="Read question and answer choices aloud">🔊 Hear it again</button>' : ''}<div class="answers" role="group" aria-labelledby="question-title">${q.options.map((o,i)=>`<button type="button" class="answer" data-answer="${i}" aria-pressed="false"><span class="letter">${LETTERS[i]}</span><span>${escapeHTML(o)}</span></button>`).join('')}</div><div class="question-actions"><button type="button" class="quiet-btn" id="skip">Skip for now</button><button type="button" class="cta" id="continue" disabled>${state.index===allCount-1?'Finish quest':'Lock in answer'} <span aria-hidden="true">➜</span></button></div><div class="status-line">No rush, no hints, just your own ideas. 💫</div></main>`;
  }

  function stats() {
    return Object.keys(SUBJECTS).map(subject => {
      const items = state.history.filter(x => x.subject === subject);
      return {subject, n:items.length, correct:items.filter(x=>x.isCorrect).length};
    });
  }

  function getTip(areas) {
    const weakest = [...areas].sort((a,b)=>a.correct/a.n-b.correct/b.n)[0];
    const tips = {
      math:'Try five minutes of mental math with everyday numbers. Say each step out loud, and check your answer with the opposite operation.',
      pattern:'Look at the gaps between numbers first. Ask: is each jump bigger, smaller, or changing by a rule?',
      logic:'Draw a quick diagram or rule out impossible choices one by one. An explanation is as important as the answer.',
      reading:'After each short story, explain what happened, why, and which words give you the clue.',
    };
    return tips[weakest.subject];
  }

  function finalResults() {
    const count = state.history.filter(x=>x.isCorrect).length;
    const skipped = state.history.filter(x=>x.chosen===null).length;
    const areas = stats();
    const adv = getTip(areas);
    const stars = count >= 10 ? '🌟' : count >= 6 ? '🏅' : '💫';
    return `${header()}<main class="results"><div class="celebrate"><div class="medallion" aria-hidden="true">${stars}</div><div class="eyebrow">${IS_GIRL?'✧ THE ROYAL QUEST IS COMPLETE':'✦ MISSION COMPLETE'}</div><h1>${IS_GIRL?'You made magic!':'Mission accomplished!'}</h1><p class="subtitle">${IS_GIRL?'You tried reading, logic, and math adventures, and that is something to celebrate.':'You explored logic, numbers, and patterns. Now here is what you solved.'}</p></div><div class="scoreboard"><div class="score-stat"><b>${count}/${allCount}</b><small>Correct</small></div><div class="score-stat"><b>${areas.length}</b><small>Skills explored</small></div><div class="score-stat"><b>${skipped}</b><small>Skipped</small></div></div><h2 class="section-heading">Your skill map</h2>${areas.map(a=>`<div class="breakdown-row"><div class="breakdown-labels"><span>${SUBJECTS[a.subject].icon} ${SUBJECTS[a.subject].label}</span><span>${a.correct} of ${a.n}</span></div><div class="bar-bg"><div class="bar-fill" style="width:${a.correct/a.n*100}%"></div></div></div>`).join('')}<div class="advice"><strong>🎯 Next practice idea</strong><div>${escapeHTML(adv)}</div></div><details class="review"><summary>🔎 Review every answer</summary>${state.history.map((x,i)=>`<div class="review-item"><div class="rmeta">${i+1}. ${escapeHTML(SUBJECTS[x.subject].label)} · ${['','Starter','Explorer','Challenger'][x.level]} · ${x.isCorrect?'✓ Correct':x.chosen===null?'— Skipped':'✗ Try again'}</div><b>${escapeHTML(x.prompt)}</b><p>Your answer: ${x.chosen===null?'Skipped':escapeHTML(x.options[x.chosen])}</p><p class="answer-correct">Correct answer: ${escapeHTML(x.options[x.correct])}</p><p>Why: ${escapeHTML(x.why)}</p></div>`).join('')}</details><div class="result-actions"><button type="button" class="cta" id="share">📤 Share report</button><button type="button" class="quiet-btn" id="restart">↻ Play again</button></div><div class="parent-note"><strong>For parents / Para mamá y papá:</strong> This is an informal, adaptive practice activity, not a standardized IQ or giftedness test. Different sessions can use different questions and difficulty levels. The report stays on this device until you share it. No answers are sent to a server.</div></main><p class="footnote">Made with ❤️ for Divertoons</p>`;
  }

  function reportText() {
    const a = stats();
    const n = state.history.filter(x=>x.isCorrect).length;
    return [
      `DIVERTOONS — ${IS_GIRL?'Magical Reading & Math':'Cosmic Logic & Math'} Quest`,
      `Result: ${n}/${allCount} correct`,
      ...a.map(s=>`${SUBJECTS[s.subject].label}: ${s.correct}/${s.n}`),
      '', 'REVIEW:',
      ...state.history.map((x,i)=>`${i+1}. [${SUBJECTS[x.subject].label}, level ${x.level}] ${x.prompt}\nGiven: ${x.chosen===null?'Skipped':x.options[x.chosen]}\nCorrect: ${x.options[x.correct]}\nExplanation: ${x.why}`),
      '', 'Informal adaptive practice only — not an IQ test.'
    ].join('\n');
  }

  function render() {
    app.innerHTML = `<div class="shell">${state.phase === 'intro' ? intro() : state.phase === 'quiz' ? showQuestion() : finalResults()}</div>`;
    document.title = CONFIG.title + ' | Divertoons';
  }

  function pick(i) {
    if (state.phase !== 'quiz') return;
    state.chosen = i;
    app.querySelectorAll('.answer').forEach((btn,j) => {
      btn.classList.toggle('selected', i===j);
      btn.setAttribute('aria-pressed', i===j ? 'true' : 'false');
    });
    document.querySelector('#continue').disabled = false;
  }

  function speak() {
    if (!('speechSynthesis' in window) || !state.current) return;
    if (IS_GIRL && state.current.subject === 'reading') return;
    safeStopSpeech();
    const q = state.current;
    const content = q.prompt + '. ' + q.options.map((option,i)=>`Choice ${LETTERS[i]}: ${option}.`).join(' ');
    const utterance = new SpeechSynthesisUtterance(content);
    utterance.lang = 'en-US';
    utterance.rate = .82;
    utterance.pitch = IS_GIRL ? 1.1 : 1;
    window.speechSynthesis.speak(utterance);
  }

  function toast(text) {
    document.querySelector('.toast')?.remove();
    clearTimeout(toastTimer);
    const node=document.createElement('div');
    node.className='toast';
    node.textContent=text;
    node.setAttribute('role','status');
    document.body.append(node);
    toastTimer=setTimeout(()=>node.remove(),3000);
  }

  async function shareReport() {
    const content=reportText();
    if (navigator.share) {
      try { await navigator.share({title: CONFIG.title + ' — Divertoons',text:content}); return; }
      catch (err) { if (err.name==='AbortError') return; }
    }
    try { await navigator.clipboard.writeText(content); toast('Report copied! Paste it into a message.'); }
    catch (_) {
      const area=document.createElement('textarea');area.value=content;area.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(area);area.select();
      const done=document.execCommand('copy');area.remove();
      toast(done?'Report copied!':'Could not copy. Take a screenshot of your results.');
    }
  }

  app.addEventListener('click',e=>{
    const btn=e.target.closest('button');
    if (!btn) return;
    if (btn.id==='start') return start();
    if (btn.hasAttribute('data-answer')) return pick(Number(btn.getAttribute('data-answer')));
    if (btn.id==='listen') return speak();
    if (btn.id==='continue') return submit();
    if (btn.id==='skip') return skip();
    if (btn.id==='restart') return reset();
    if (btn.id==='share') return shareReport();
  });
  reset();
})();
</script>
</body>
</html>
